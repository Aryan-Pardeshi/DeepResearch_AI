name: Stale
on:
  schedule:
    - cron: '0 3 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: This issue has had no activity for 30 days and will be closed in 7 unless updated.
          stale-pr-message: This PR has had no activity for 30 days and will be closed in 7 unless updated.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
