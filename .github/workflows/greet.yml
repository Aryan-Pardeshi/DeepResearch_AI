name: Greet
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: Thanks for opening your first issue! It will be triaged soon.
          pr-message: Thanks for your first PR! A maintainer will review it shortly.
