name: Greet
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: Thanks for opening your first issue! It will be triaged soon. If you want to fix it yourself, see CONTRIBUTING.md.
          pr-message: Thanks for your first PR! Please check that `pytest` passes and the checklist is filled in. A maintainer will review it shortly.
