name: Keep Backend Warm

# Caveat: GitHub's `schedule` trigger is not guaranteed to fire exactly on time —
# under platform load it can be delayed several minutes, occasionally more.
# A */10 cadence gives real margin against Render's ~15 minute idle window,
# but treat this as "usually keeps it warm," not a hard guarantee.
# Do not schedule more frequently than every 10 minutes (to avoid throttling/disabling on free accounts).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping /healthz
    runs-on: ubuntu-latest
    steps:
      - name: Ping live health endpoint
        run: |
          URL="https://deepresearch-ai-gxiu.onrender.com/healthz"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 60 "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | awk '{print $1}')
          HTTP_TIME=$(echo "$RESPONSE" | awk '{print $2}')
          echo "Pinged $URL -> HTTP $HTTP_CODE in ${HTTP_TIME}s"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: Expected HTTP 200, received $HTTP_CODE"
            exit 1
          fi
