services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-bot:latest
    container_name: research-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Live code reload during development
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # Durable graph checkpoints and LLM cache; survives rebuilds
      - research-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  research-data:
