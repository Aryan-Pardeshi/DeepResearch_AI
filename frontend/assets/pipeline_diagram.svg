<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 540" width="100%" height="100%" style="background: #0d111a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#181534" />
    </linearGradient>
    
    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232a3b" />
      <stop offset="100%" stop-color="#181e2b" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="diamondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="180" cy="140" r="140" fill="#6366f1" opacity="0.08" />
  <circle cx="1140" cy="140" r="160" fill="#8b5cf6" opacity="0.07" />
  <circle cx="660" cy="400" r="180" fill="#06b6d4" opacity="0.06" />

  <!-- ========================================================================= -->
  <!-- CONNECTING PATHS & ARROWS (Drawn Behind Nodes) -->
  <!-- ========================================================================= -->

  <!-- Top Row Connectors -->
  <!-- Problem Statement -> Scope -->
  <path d="M 175 140 L 220 140" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- Scope -> Human Review 1 (Top forward path) -->
  <path d="M 370 120 C 400 95, 430 95, 460 120" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Human Review 1 -> Literature (Approved) -->
  <path d="M 535 140 L 610 140" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="548" y="123" width="52" height="18" rx="4" fill="#064e3b" opacity="0.8" />
  <text x="574" y="136" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">approved</text>

  <!-- Human Review 1 -> Scope (Revise loop - bottom) -->
  <path d="M 480 175 C 445 205, 395 205, 360 175" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="420" y="208" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">revise</text>

  <!-- Literature -> Human Review 2 (Top forward path) -->
  <path d="M 760 120 C 790 95, 820 95, 850 120" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Human Review 2 -> Literature (Revise loop - bottom) -->
  <path d="M 870 175 C 835 205, 785 205, 750 175" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="810" y="208" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">revise</text>

  <!-- ========================================================================= -->
  <!-- SNAKE S-CURVE: Row 1 (Gate 2) -> Row 2 (Hypotheses) -->
  <!-- ========================================================================= -->
  <path d="M 945 140 C 1220 140, 1220 280, 660 280 C 60 280, 60 410, 195 410" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.85" marker-end="url(#arrow-blue)" />
  <rect x="635" y="270" width="58" height="20" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="664" y="284" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">approved</text>

  <!-- Bottom Row Connectors -->
  <!-- Hypotheses -> Human Review 3 -->
  <path d="M 350 410 L 420 410" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="360" y="393" width="52" height="18" rx="4" fill="#064e3b" opacity="0.8" />
  <text x="386" y="406" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">approved</text>

  <!-- Human Review 3 -> Hypotheses (Revise loop) -->
  <path d="M 435 440 C 400 475, 340 475, 300 445" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="365" y="480" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">revise</text>

  <!-- Human Review 3 -> Methodology -->
  <path d="M 495 410 L 570 410" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="508" y="393" width="52" height="18" rx="4" fill="#064e3b" opacity="0.8" />
  <text x="534" y="406" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">approved</text>

  <!-- Methodology -> Paper Assembly -->
  <path d="M 720 410 L 795 410" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <!-- Methodology Revise Loop -->
  <path d="M 690 445 C 660 475, 600 475, 570 445" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="630" y="480" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">revise</text>

  <!-- Paper Assembly -> Final Paper (Approved) -->
  <path d="M 945 410 L 1025 410" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="958" y="393" width="52" height="18" rx="4" fill="#064e3b" opacity="0.8" />
  <text x="984" y="406" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">approved</text>

  <!-- Paper Assembly Revise Loop -->
  <path d="M 920 445 C 885 475, 830 475, 795 445" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="855" y="480" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">revise</text>


  <!-- ========================================================================= -->
  <!-- NODES: TOP ROW -->
  <!-- ========================================================================= -->

  <!-- 0. Problem Statement (Pill) -->
  <g transform="translate(30, 112)">
    <rect width="145" height="56" rx="14" fill="url(#pillGrad)" stroke="#475569" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="72" y="33" fill="#f1f5f9" font-size="12" font-weight="700" letter-spacing="0.5" text-anchor="middle">PROBLEM</text>
    <text x="72" y="47" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="0.5" text-anchor="middle">STATEMENT</text>
  </g>

  <!-- 1. Scope Card -->
  <g transform="translate(225, 92)" filter="url(#cardShadow)">
    <rect width="150" height="96" rx="14" fill="url(#cardGrad)" stroke="#3b4861" stroke-width="1.5" />
    <!-- Icon (Checklist/Search) -->
    <g transform="translate(63, 12)" fill="#818cf8">
      <rect x="2" y="2" width="20" height="16" rx="3" fill="none" stroke="#818cf8" stroke-width="1.8" />
      <line x1="6" y1="7" x2="14" y2="7" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="6" y1="11" x2="11" y2="11" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="17" cy="14" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="19.5" y1="16.5" x2="23" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="75" y="58" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1 - SCOPE</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">definition &amp; keywords</text>
    <text x="75" y="86" fill="#64748b" font-size="9" text-anchor="middle">PICOC · Search Protocol</text>
  </g>

  <!-- Human Review 1 (Diamond) -->
  <g transform="translate(497, 140)" filter="url(#diamondGlow)">
    <rect x="-36" y="-36" width="72" height="72" rx="12" transform="rotate(45)" fill="url(#diamondGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- User Avatar Icon -->
    <g transform="translate(-10, -22)" fill="#1e293b">
      <circle cx="10" cy="8" r="5" />
      <path d="M 2 21 C 2 16, 6 15, 10 15 C 14 15, 18 16, 18 21 Z" />
    </g>
    <text x="0" y="8" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">HUMAN REVIEW</text>
    <text x="0" y="22" fill="#4338ca" font-size="14" font-weight="900" text-anchor="middle">1</text>
  </g>

  <!-- 2. Literature Card -->
  <g transform="translate(615, 92)" filter="url(#cardShadow)">
    <rect width="150" height="96" rx="14" fill="url(#cardGrad)" stroke="#3b4861" stroke-width="1.5" />
    <!-- Icon (Books / Screening) -->
    <g transform="translate(63, 12)" fill="#818cf8">
      <path d="M 4 4 L 10 4 L 10 18 L 4 18 Z" fill="none" stroke="#818cf8" stroke-width="1.6" />
      <path d="M 12 4 L 18 4 L 18 18 L 12 18 Z" fill="none" stroke="#818cf8" stroke-width="1.6" />
      <circle cx="18" cy="14" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="20.5" y1="16.5" x2="23" y2="19" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="75" y="58" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2 - LITERATURE</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">corpus, review &amp; extraction</text>
    <text x="75" y="86" fill="#64748b" font-size="9" text-anchor="middle">6 APIs · Screening · Rigor</text>
  </g>

  <!-- Human Review 2 (Diamond) -->
  <g transform="translate(895, 140)" filter="url(#diamondGlow)">
    <rect x="-36" y="-36" width="72" height="72" rx="12" transform="rotate(45)" fill="url(#diamondGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- User Avatar Icon -->
    <g transform="translate(-10, -22)" fill="#1e293b">
      <circle cx="10" cy="8" r="5" />
      <path d="M 2 21 C 2 16, 6 15, 10 15 C 14 15, 18 16, 18 21 Z" />
    </g>
    <text x="0" y="8" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">HUMAN REVIEW</text>
    <text x="0" y="22" fill="#4338ca" font-size="14" font-weight="900" text-anchor="middle">2</text>
  </g>


  <!-- ========================================================================= -->
  <!-- NODES: BOTTOM ROW -->
  <!-- ========================================================================= -->

  <!-- 3. Hypotheses Card -->
  <g transform="translate(200, 362)" filter="url(#cardShadow)">
    <rect width="150" height="96" rx="14" fill="url(#cardGrad)" stroke="#3b4861" stroke-width="1.5" />
    <!-- Icon (Network / Nodes) -->
    <g transform="translate(63, 12)">
      <circle cx="12" cy="5" r="3" fill="#818cf8" />
      <circle cx="5" cy="17" r="3" fill="#38bdf8" />
      <circle cx="19" cy="17" r="3" fill="#38bdf8" />
      <line x1="12" y1="5" x2="5" y2="17" stroke="#94a3b8" stroke-width="1.4" />
      <line x1="12" y1="5" x2="19" y2="17" stroke="#94a3b8" stroke-width="1.4" />
    </g>
    <text x="75" y="58" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3 - HYPOTHESES</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">theoretical &amp; empirical</text>
    <text x="75" y="86" fill="#64748b" font-size="9" text-anchor="middle">Taxonomy · Model · H1..H5</text>
  </g>

  <!-- Human Review 3 (Diamond) -->
  <g transform="translate(457, 410)" filter="url(#diamondGlow)">
    <rect x="-36" y="-36" width="72" height="72" rx="12" transform="rotate(45)" fill="url(#diamondGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- User Avatar Icon -->
    <g transform="translate(-10, -22)" fill="#1e293b">
      <circle cx="10" cy="8" r="5" />
      <path d="M 2 21 C 2 16, 6 15, 10 15 C 14 15, 18 16, 18 21 Z" />
    </g>
    <text x="0" y="8" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">HUMAN REVIEW</text>
    <text x="0" y="22" fill="#4338ca" font-size="14" font-weight="900" text-anchor="middle">3</text>
  </g>

  <!-- 4. Methodology Card -->
  <g transform="translate(570, 362)" filter="url(#cardShadow)">
    <rect width="150" height="96" rx="14" fill="url(#cardGrad)" stroke="#3b4861" stroke-width="1.5" />
    <!-- Icon (Flowchart/Plan) -->
    <g transform="translate(63, 12)">
      <rect x="2" y="2" width="20" height="16" rx="2" fill="none" stroke="#818cf8" stroke-width="1.6" />
      <rect x="5" y="5" width="4" height="4" fill="#38bdf8" />
      <rect x="13" y="5" width="4" height="4" fill="#818cf8" />
      <rect x="9" y="12" width="4" height="4" fill="#818cf8" />
      <line x1="7" y1="9" x2="11" y2="12" stroke="#94a3b8" stroke-width="1.2" />
    </g>
    <text x="75" y="58" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">4 - METHODOLOGY</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">design &amp; analysis plan</text>
    <text x="75" y="86" fill="#64748b" font-size="9" text-anchor="middle">Empirical Matrix · Sections</text>
  </g>

  <!-- 5. Paper Assembly Card -->
  <g transform="translate(795, 362)" filter="url(#cardShadow)">
    <rect width="150" height="96" rx="14" fill="url(#cardGrad)" stroke="#3b4861" stroke-width="1.5" />
    <!-- Icon (Folder/Document) -->
    <g transform="translate(63, 12)">
      <path d="M 3 6 L 8 6 L 10 8 L 21 8 L 21 19 L 3 19 Z" fill="none" stroke="#818cf8" stroke-width="1.6" />
      <line x1="7" y1="12" x2="17" y2="12" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />
      <line x1="7" y1="15" x2="13" y2="15" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />
    </g>
    <text x="75" y="58" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">5 - PAPER ASSEMBLY</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">sections, refs &amp; figures</text>
    <text x="75" y="86" fill="#64748b" font-size="9" text-anchor="middle">PRISMA · Audit · LaTeX</text>
  </g>

  <!-- Final Research Paper Icon & Badge -->
  <g transform="translate(1040, 346)" filter="url(#cardShadow)">
    <!-- Stacked Pages Effect -->
    <rect x="8" y="0" width="60" height="76" rx="6" fill="#334155" opacity="0.6" />
    <rect x="4" y="4" width="60" height="76" rx="6" fill="#475569" opacity="0.8" />
    <rect x="0" y="8" width="60" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Lines on Front Page -->
    <line x1="8" y1="20" x2="40" y2="20" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="28" x2="52" y2="28" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="36" x2="48" y2="36" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="44" x2="52" y2="44" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="52" x2="36" y2="52" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

    <text x="30" y="102" fill="#f1f5f9" font-size="12" font-weight="800" letter-spacing="0.5" text-anchor="middle">FINAL RESEARCH</text>
    <text x="30" y="117" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">PAPER</text>
    <text x="30" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">PDF · DOCX</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER TAGS -->
  <!-- ========================================================================= -->
  <text x="660" y="520" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.3">#AcademicResearch &amp;nbsp;&amp;nbsp; #AIWorkflow &amp;nbsp;&amp;nbsp; #PaperSynthesis &amp;nbsp;&amp;nbsp; #HumanInTheLoop &amp;nbsp;&amp;nbsp; #PRISMA2020</text>
</svg>
